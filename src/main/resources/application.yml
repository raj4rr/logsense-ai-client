server:
  port: 8081

spring:
  application:
    name: logsense-ai-client
  ai:
    model:
      chat: ${AI_PROVIDER:ollama}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:8b}

logsense:
  server:
    url: ${LOGSENSE_SERVER_URL:http://localhost:8080}
    mcp-endpoint: ${LOGSENSE_MCP_ENDPOINT:/mcp}
    api-key: ${LOGSENSE_API_KEY:replace-with-a-long-random-api-key}
